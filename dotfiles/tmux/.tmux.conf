# ============================================================================
# ~/.tmux.conf - 由 linux-tune 管理
# ============================================================================

# 前缀键：C-a（比 C-b 顺手，C-b 保留用于上翻页）
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 基础体验
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -g mouse on
set -g escape-time 10
set -g focus-events on
setw -g mode-keys vi
set -g set-clipboard on
set -g allow-passthrough on

# 更符合直觉的分屏
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "已重载配置"
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 配色（Tokyo Night 风格）
set -g status-style 'bg=#1a1b26 fg=#a9b1d6'
set -g status-left '#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[bg=#1a1b26]  '
set -g status-left-length 30
set -g status-right '#[fg=#7dcfff]#{?client_prefix,⌨ PREFIX ,}#[fg=#c0caf5]%Y-%m-%d %H:%M'
set -g status-right-length 60
setw -g window-status-current-style 'bg=#7aa2f7,fg=#1a1b26,bold'
setw -g window-status-current-format ' #I:#W '
setw -g window-status-format ' #I:#W '
set -g pane-border-style 'fg=#2f3549'
set -g pane-active-border-style 'fg=#7aa2f7'
set -g message-style 'bg=#24283b fg=#c0caf5'

# 复制粘贴走系统剪贴板（Wayland）
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind p paste-buffer
